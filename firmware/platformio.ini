[platformio]
default_envs = paper_e1001

[env:paper_e1001]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
build_flags =
    -D BOARD_HAS_PSRAM
    -D BOARD_SCREEN_COMBO=520
    -I include
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git#24c5094cbde79933e93565ee68119e214c48fb36
    https://github.com/Makuna/Rtc.git#7928697ff4a5e4ae55824c47b961aac0503720d9
monitor_speed = 115200
; Build only. Installation must use a separately reviewed flash plan.
extra_scripts = pre:guard_upload.py
